name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime deps + pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Secrets scan (no live values in tracked files)
        run: |
          ! grep -rniF -f .secrets-patterns --exclude-dir=.git --exclude-dir=.venv \
            --exclude=.secrets-patterns --exclude=.env . 
